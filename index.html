<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brain Orbit Whiteboard</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f3f4f6;
      text-align:center;
    }

    .navbar{
      background:#1e3a8a;
      color:white;
      padding:15px;
      font-size:24px;
      font-weight:bold;
    }

    .live-btn{
      margin-top:30px;
      padding:15px 30px;
      font-size:20px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }

    .live-btn:hover{
      background:#1d4ed8;
    }

    #whiteboard-container{
      display:none;
      margin-top:20px;
    }

    .tools{
      margin:15px;
    }

    .tools button{
      padding:10px 15px;
      margin:5px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
    }

    canvas{
      border:3px solid black;
      background:white;
      cursor:crosshair;
    }

    .black{ background:black; color:white; }
    .red{ background:red; color:white; }
    .blue{ background:blue; color:white; }
    .green{ background:green; color:white; }
    .eraser{ background:gray; color:white; }
    .clear{ background:#111827; color:white; }

  </style>
</head>
<body>

  <div class="navbar">
    Brain Orbit Live Whiteboard
  </div>

  <button class="live-btn" onclick="openWhiteboard()">
    Open Live Class
  </button>

  <div id="whiteboard-container">

    <div class="tools">

      <!-- Pen Colors -->
      <button class="black" onclick="changeColor('black')">Black Pen</button>
      <button class="red" onclick="changeColor('red')">Red Pen</button>
      <button class="blue" onclick="changeColor('blue')">Blue Pen</button>
      <button class="green" onclick="changeColor('green')">Green Pen</button>

      <!-- Eraser -->
      <button class="eraser" onclick="eraser()">Eraser</button>

      <!-- Brush Sizes -->
      <button onclick="changeSize(2)">Small</button>
      <button onclick="changeSize(5)">Medium</button>
      <button onclick="changeSize(10)">Large</button>

      <!-- Clear -->
      <button class="clear" onclick="clearBoard()">Clear Board</button>

    </div>

    <canvas id="board" width="1100" height="500"></canvas>

  </div>

  <script>

    function openWhiteboard(){
      document.getElementById("whiteboard-container").style.display = "block";
    }

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    let drawing = false;
    let currentColor = "black";
    let brushSize = 3;

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mouseup", stop);
    canvas.addEventListener("mousemove", draw);

    function start(e){
      drawing = true;
      draw(e);
    }

    function stop(){
      drawing = false;
      ctx.beginPath();
    }

    function draw(e){

      if(!drawing) return;

      const rect = canvas.getBoundingClientRect();

      ctx.lineWidth = brushSize;
      ctx.lineCap = "round";
      ctx.strokeStyle = currentColor;

      ctx.lineTo(
        e.clientX - rect.left,
        e.clientY - rect.top
      );

      ctx.stroke();

      ctx.beginPath();

      ctx.moveTo(
        e.clientX - rect.left,
        e.clientY - rect.top
      );
    }

    function changeColor(color){
      currentColor = color;
    }

    function changeSize(size){
      brushSize = size;
    }

    function eraser(){
      currentColor = "white";
    }

    function clearBoard(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

  </script>

</body>
</html>
