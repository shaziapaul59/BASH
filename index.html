<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brain Orbit Live Class</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f4f6f9;
      text-align:center;
    }

    .navbar{
      background:#1e3a8a;
      padding:15px;
      color:white;
      font-size:24px;
      font-weight:bold;
    }

    .live-btn{
      margin-top:50px;
      padding:15px 30px;
      font-size:20px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }

    .live-btn:hover{
      background:#1d4ed8;
    }

    #whiteboard-container{
      display:none;
      margin-top:20px;
    }

    canvas{
      border:3px solid #000;
      background:white;
      cursor:crosshair;
    }

    .tools{
      margin:15px;
    }

    .tools button{
      padding:10px 20px;
      margin:5px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      background:#111827;
      color:white;
    }
  </style>
</head>
<body>

  <div class="navbar">
    Brain Orbit Live Classes
  </div>

  <!-- Live Class Button -->
  <button class="live-btn" onclick="openWhiteboard()">
    Open Live Class
  </button>

  <!-- Whiteboard -->
  <div id="whiteboard-container">

    <div class="tools">
      <button onclick="clearBoard()">Clear Board</button>
    </div>

    <canvas id="board" width="1000" height="500"></canvas>

  </div>

  <script>
    function openWhiteboard() {
      document.getElementById("whiteboard-container").style.display = "block";
    }

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    let drawing = false;

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mouseup", stop);
    canvas.addEventListener("mousemove", draw);

    function start(e){
      drawing = true;
      draw(e);
    }

    function stop(){
      drawing = false;
      ctx.beginPath();
    }

    function draw(e){
      if(!drawing) return;

      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.strokeStyle = "black";

      const rect = canvas.getBoundingClientRect();

      ctx.lineTo(
        e.clientX - rect.left,
        e.clientY - rect.top
      );

      ctx.stroke();
      ctx.beginPath();

      ctx.moveTo(
        e.clientX - rect.left,
        e.clientY - rect.top
      );
    }

    function clearBoard(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  </script>

</body>
</html>
